name: Semgrep SAST

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep:1.161.0
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark workspace safe (avoid 'dubious ownership' from container UID mismatch)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Semgrep scan (OSS rule packs)
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --config=p/cwe-top-25 \
            --config=p/typescript \
            --config=p/github-actions \
            --sarif --sarif-output=semgrep.sarif \
            --metrics=off \
            --no-error \
            || true

      - name: Upload SARIF to GitHub Code Scanning
        if: hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Semgrep blocking gate (ERROR severity)
        run: |
          semgrep scan \
            --config=p/secrets \
            --config=p/security-audit \
            --severity=ERROR \
            --error \
            --metrics=off
