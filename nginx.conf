# HTTP — redirect all traffic to HTTPS.
# certbot --nginx will auto-manage the HTTPS block below.
server {
    listen 80;
    listen [::]:80;
    server_name growlingeyes.com www.growlingeyes.com;

    # Redirect HTTP to HTTPS (enforced once certbot sets up SSL).
    return 301 https://$host$request_uri;
}

# HTTPS — main application server.
# Run `certbot --nginx -d growlingeyes.com -d www.growlingeyes.com`
# to obtain and install a Let's Encrypt certificate.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name growlingeyes.com www.growlingeyes.com;

    # Paths below are managed by certbot; placeholders prevent nginx from
    # failing to start before the certificate is issued.
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    root /home/ubuntu/neurooz/dist;
    index index.html;

    # Serve pre-compressed assets when available
    gzip_static on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: allow scripts/styles from self (Vite bundles), connect to Supabase for auth/API
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://growlingeyes.com; font-src 'self' data:; frame-ancestors 'none';" always;

    # Cache static assets aggressively (Vite hashes filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # For all other routes, serve index.html so React Router and Supabase
    # OAuth callbacks (hash-based tokens) are handled client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }
}
